<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nocotine — Reset your password</title>
<meta name="description" content="Set a new password for your Nocotine account.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<style>
  .field { margin: 0 0 14px; }
  .field label { display:block; font-size:13px; font-weight:600; color:var(--muted);
                 text-transform:uppercase; letter-spacing:.06em; margin:0 0 6px; }
  .field input {
    width:100%; padding:13px 14px; font:inherit; color:var(--text);
    background:var(--bg); border:1px solid var(--rule); border-radius:12px;
  }
  .field input:focus { outline:none; border-color:var(--ink); }
  button.primary {
    width:100%; padding:15px; font:inherit; font-weight:700; cursor:pointer;
    color:var(--bg); background:var(--ink); border:0; border-radius:14px;
  }
  button.primary[disabled] { opacity:.45; cursor:default; }
  .msg { margin:16px 0 0; padding:13px 15px; border-radius:12px; font-size:15px; }
  .msg.err { background:rgba(229,72,77,.12); color:var(--accent); }
  .msg.ok  { background:rgba(46,160,67,.12); color:#2ea043; }
  .hint { font-size:13px; color:var(--faint); margin:10px 0 0; }
</style>
</head>
<body>
<div class="wrap">

  <header class="site">
    <span class="mark">💨</span>
    <div>
      <a class="name" href="index.html">Nocotine</a><br>
      <span class="by">by Pier94 Talent LLC</span>
    </div>
  </header>

  <h1>Reset your password</h1>
  <p class="intro">Choose a new password for your Nocotine account, then sign in with it in the app.</p>

  <div class="card">
    <form id="form" hidden>
      <div class="field">
        <label for="pw">New password</label>
        <input id="pw" type="password" autocomplete="new-password" minlength="6"
               placeholder="At least 6 characters" required>
      </div>
      <div class="field">
        <label for="pw2">Confirm new password</label>
        <input id="pw2" type="password" autocomplete="new-password" minlength="6"
               placeholder="Repeat it" required>
      </div>
      <button class="primary" id="submit" type="submit">Set new password</button>
      <p class="hint">After saving, return to the Nocotine app and sign in with your new password.</p>
    </form>
    <div id="out"></div>
  </div>

  <p class="hint">Trouble? Email <a href="mailto:support@pier94talent.com">support@pier94talent.com</a>.</p>

</div>

<script>
// Supabase sends the recovery session in the URL *fragment*, which never leaves
// the browser — it is not sent to GitHub Pages or logged in any server access
// log. We read the access token from it and use it to authorise exactly one
// call: updating this user's password.
//
// The anon/publishable key below is the same one shipped inside the app. It is
// safe in a public page — it grants only what Row Level Security allows. The
// service_role key must NEVER appear here.
const SUPABASE_URL = "https://iqopoivzabpchvpmbkem.supabase.co";
const ANON_KEY = "sb_publishable_IKUQXzp3wDDowKzMjWCmig_V8jpqvNs";

const out = document.getElementById("out");
const form = document.getElementById("form");
const submit = document.getElementById("submit");

const show = (kind, text) => { out.innerHTML = `<p class="msg ${kind}">${text}</p>`; };

const params = new URLSearchParams(location.hash.replace(/^#/, ""));
const token = params.get("access_token");
const type = params.get("type");
const linkError = params.get("error_description") || params.get("error");

if (linkError) {
  show("err", decodeURIComponent(linkError).replace(/\+/g, " ") +
    " — request a new reset link from the app and open it within the hour.");
} else if (!token) {
  show("err", "This page needs a password reset link. Open the link from the email we sent you — " +
    "and note the link expires, so request a fresh one if it has been a while.");
} else if (type && type !== "recovery") {
  show("err", "That link is not a password reset link. Request a new one from the app.");
} else {
  form.hidden = false;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const pw2 = document.getElementById("pw2").value;

  if (pw.length < 6) { show("err", "Password must be at least 6 characters."); return; }
  if (pw !== pw2)    { show("err", "Those two passwords don't match."); return; }

  submit.disabled = true;
  submit.textContent = "Saving…";
  out.innerHTML = "";

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "apikey": ANON_KEY,
        "Authorization": `Bearer ${token}`,
      },
      body: JSON.stringify({ password: pw }),
    });

    if (res.ok) {
      form.hidden = true;
      show("ok", "Password updated. Open the Nocotine app and sign in with your new password.");
      // Drop the token from the address bar so it isn't left in history.
      history.replaceState(null, "", location.pathname);
      return;
    }

    let detail = "";
    try {
      const body = await res.json();
      detail = body.msg || body.message || body.error_description || body.error || "";
    } catch (_) { /* non-JSON error body */ }

    if (res.status === 401 || res.status === 403) {
      show("err", "That reset link has expired or was already used. Request a new one from the app.");
    } else if (res.status === 422) {
      show("err", detail || "That password was rejected. Try a longer one.");
    } else {
      show("err", detail || `Couldn't update the password (error ${res.status}). Please try again.`);
    }
  } catch (_) {
    show("err", "Couldn't reach the server. Check your connection and try again.");
  } finally {
    submit.disabled = false;
    submit.textContent = "Set new password";
  }
});
</script>
</body>
</html>
